# EXEMPLE — ne pas appliquer tel quel.
#
# Génère les vrais secrets directement sur la VM, jamais via un fichier
# committé :
#
#   kubectl create secret generic mysql-credentials -n aparte \
#     --from-literal=MYSQL_ROOT_PASSWORD="$(openssl rand -hex 24)" \
#     --from-literal=MYSQL_DATABASE=aparte \
#     --from-literal=MYSQL_USER=aparte \
#     --from-literal=MYSQL_PASSWORD="$(openssl rand -hex 24)"
#
# DB_USER / DB_PASSWORD du Secret api-secrets (20-api-secret.example.yaml)
# doivent correspondre à MYSQL_USER / MYSQL_PASSWORD ci-dessus.
apiVersion: v1
kind: Secret
metadata:
  name: mysql-credentials
  namespace: aparte
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: change-me-root
  MYSQL_DATABASE: aparte
  MYSQL_USER: aparte
  MYSQL_PASSWORD: change-me
