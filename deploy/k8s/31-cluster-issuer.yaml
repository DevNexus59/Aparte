# cert-manager doit être installé avant d'appliquer ce fichier (voir
# docs/07-deploiement-infra-k8s.md). Ce ClusterIssuer est valable pour tout
# le cluster, pas seulement le namespace aparte.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    # TODO: remplace par l'email à utiliser pour les notifications Let's Encrypt.
    email: fourdin.pfmg@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
