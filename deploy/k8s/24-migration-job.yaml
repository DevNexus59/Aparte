# Job à relancer avant chaque déploiement d'une nouvelle image (le schéma
# évolue via de nouvelles migrations TypeORM dans apps/api/src/migrations).
# Un Job est immuable : avant de ré-appliquer ce fichier, supprime l'ancien.
#
#   kubectl delete job aparte-migrate -n aparte --ignore-not-found
#   kubectl apply -f deploy/k8s/24-migration-job.yaml
#   kubectl wait --for=condition=complete --timeout=120s job/aparte-migrate -n aparte
apiVersion: batch/v1
kind: Job
metadata:
  name: aparte-migrate
  namespace: aparte
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: migrate
          image: ghcr.io/devnexus59/cercle-api:latest
          command: ["pnpm", "migration:run:prod"]
          envFrom:
            - configMapRef:
                name: api-config
            - secretRef:
                name: api-secrets
