# EXEMPLE — ne pas appliquer tel quel.
#
# Génère le vrai secret directement sur la VM (DB_USER/DB_PASSWORD doivent
# correspondre à MYSQL_USER/MYSQL_PASSWORD du Secret mysql-credentials,
# voir 10-mysql-secret.example.yaml) :
#
#   kubectl create secret generic api-secrets -n aparte \
#     --from-literal=DB_USER=aparte \
#     --from-literal=DB_PASSWORD="<même valeur que MYSQL_PASSWORD>" \
#     --from-literal=JWT_ACCESS_SECRET="$(openssl rand -hex 64)" \
#     --from-literal=JWT_REFRESH_SECRET="$(openssl rand -hex 64)" \
#     --from-literal=MESSAGE_ENCRYPTION_KEY="$(openssl rand -hex 32)"
apiVersion: v1
kind: Secret
metadata:
  name: api-secrets
  namespace: aparte
type: Opaque
stringData:
  DB_USER: aparte
  DB_PASSWORD: change-me
  JWT_ACCESS_SECRET: change-me-access
  JWT_REFRESH_SECRET: change-me-refresh
  MESSAGE_ENCRYPTION_KEY: change-me-message-key-64-hex-chars
