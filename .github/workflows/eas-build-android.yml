name: EAS Build Android (preview)

on:
  push:
    branches: [main]
    paths:
      - 'apps/app/**'
      - 'pnpm-lock.yaml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Bump app version (semver)
        id: bump
        run: node apps/app/scripts/bump-version.js

      - name: Commit and tag version bump
        if: steps.bump.outputs.bumped == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/app/app.json
          git commit -m "chore(app): bump version to ${{ steps.bump.outputs.version }} [skip ci]"
          git tag "app-v${{ steps.bump.outputs.version }}"
          git pull --rebase origin main
          git push origin HEAD:main
          git push origin "app-v${{ steps.bump.outputs.version }}"

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Write Google Play service account key
        working-directory: apps/app
        run: echo '${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_KEY }}' > google-service-account.json

      - name: Build and submit to internal testing
        working-directory: apps/app
        env:
          EAS_NO_VCS: 1
        run: eas build --platform android --profile preview --non-interactive --auto-submit
